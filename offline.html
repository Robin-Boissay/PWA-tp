<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxWave — Hors ligne</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem 1.75rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.25rem;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 0.85rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s ease, transform 0.1s ease;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      margin-left: 0.5rem;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .tip {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️ 📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Cette page n'a pas encore été mise en cache sur votre appareil. Vos épisodes déjà enregistrés et votre studio restent entièrement disponibles depuis l'accueil.</p>
    <div class="actions">
      <a href="/" class="btn">Retour aux podcasts</a>
      <button onclick="window.location.reload()" class="btn btn-secondary">Réessayer</button>
    </div>
    <div class="tip">
      💡 VoxWave fonctionne hors ligne grâce au Service Worker & IndexedDB.
    </div>
  </div>
</body>
</html>
